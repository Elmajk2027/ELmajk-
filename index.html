<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبة المذكرات للطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f7f7;--card:#fff;--line:#d3e2e3;--ink:#10282b;--muted:#5d7679;
  --acc:#0d9488;--accink:#fff;--off:#e4eeee;--offink:#7d9396;
  --toast:#fff6dc;--toastline:#ecd98f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c;--card:#192527;--line:#263538;--ink:#e9f1f1;--muted:#8fa3a5;
  --acc:#2dd4bf;--accink:#0b1f1d;--off:#2a393c;--offink:#7d9194;
  --toast:#2a281a;--toastline:#403c22;}}
:root[data-theme="dark"]{--bg:#0f1a1c;--card:#192527;--line:#263538;--ink:#e9f1f1;--muted:#8fa3a5;--acc:#2dd4bf;--accink:#0b1f1d;--off:#2a393c;--offink:#7d9194;--toast:#2a281a;--toastline:#403c22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:30px 16px 150px}
h1{font-size:clamp(30px,8vw,44px);font-weight:700;margin:0 0 6px;line-height:1.3}
.sub{color:var(--muted);margin:0 0 24px;font-size:19px}
button{font:inherit;color:inherit}
.stages{display:flex;gap:12px;margin-bottom:16px}
.stage{flex:1;height:72px;font-size:19px;font-weight:500;background:var(--card);border:2px solid var(--line);border-radius:22px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:9px 24px;font-size:17px;background:var(--card);border:2px solid var(--line);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
.search{width:100%;padding:16px 20px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:18px}
.search::placeholder{color:var(--muted)}
.stage:focus-visible,.chip:focus-visible,.search:focus,.x:focus-visible,.go:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px}
.t{font-size:20px;font-weight:700;margin:0}
.m{color:var(--muted);font-size:16px;margin:8px 0 16px}
.go{display:block;width:100%;padding:15px;text-align:center;text-decoration:none;font-size:18px;font-weight:700;border:0;border-radius:16px;background:var(--acc);color:var(--accink);cursor:pointer}
.go[disabled]{background:var(--off);color:var(--offink);font-weight:500;cursor:default}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.toast{position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:736px;margin:0 auto;background:var(--toast);border:2px solid var(--toastline);border-radius:26px;padding:20px 22px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast .tt{font-size:19px;font-weight:700;margin:0}
.toast .td{color:var(--muted);margin:2px 0 0;font-size:17px}
.toast .body{flex:1}
.x{flex:none;background:transparent;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--ink);cursor:pointer;order:2}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .35s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 مكتبة المذكرات</h1>
  <p class="sub">اختار مرحلتك وحمّل المذكرة اللي محتاجها.</p>
  <div class="stages" id="stages">
    <button class="stage" data-v="إعدادي" aria-pressed="true">إعدادي</button>
    <button class="stage" data-v="ثانوي" aria-pressed="false">ثانوي</button>
    <button class="stage" data-v="بكالوريا" aria-pressed="false">بكالوريا</button>
  </div>
  <div class="chips" id="chips"></div>
  <input id="q" class="search" type="search" placeholder="ابحث باسم المذكرة أو المادة..." aria-label="بحث">
  <ul class="list" id="list"></ul>
</div>

<aside class="toast" id="toast" hidden>
  <button class="x" id="x" aria-label="إغلاق">×</button>
  <div class="body"><p class="tt" id="tt"></p><p class="td" id="td"></p></div>
</aside>

<script>
/* أضف مذكراتك هنا. url فارغ = يظهر الزر "قريباً". hot:true = تظهر في الإشعار السفلي */
var FILES=[
 {title:"مذكرة تجريبية - علوم",stage:"إعدادي",subject:"علوم",url:""},
 {title:"مذكرة تجريبية - علوم متكاملة",stage:"إعدادي",subject:"علوم متكاملة",url:""},
 {title:"مذكرة تجريبية - فيزياء",stage:"إعدادي",subject:"فيزياء",url:""},
 {title:"مذكرة تجريبية - فيزياء",stage:"ثانوي",subject:"فيزياء",url:""},
 {title:"مذكرة تجريبية - علوم متكاملة",stage:"ثانوي",subject:"علوم متكاملة",url:""},
 {title:"مذكرة تجريبية - علوم",stage:"ثانوي",subject:"علوم",url:""},
 {title:"مذكرة تجريبية - فيزياء",stage:"بكالوريا",subject:"فيزياء",url:"",hot:true,desc:"مراجعة نهائية شاملة."},
 {title:"مذكرة تجريبية - علوم",stage:"بكالوريا",subject:"علوم",url:""}
];
var SUBJECTS=["الكل","فيزياء","علوم","علوم متكاملة"];
var st={stage:"إعدادي",subject:"الكل",q:""};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chips(){$("chips").innerHTML=SUBJECTS.map(function(s){return '<button class="chip" data-v="'+esc(s)+'" aria-pressed="'+(s===st.subject)+'">'+esc(s)+'</button>'}).join("")}
function render(){
  var q=st.q.trim();
  var r=FILES.filter(function(f){return f.stage===st.stage&&(st.subject==="الكل"||f.subject===st.subject)&&(!q||(f.title+f.subject).indexOf(q)>-1)});
  $("list").innerHTML=r.length?r.map(function(f){
    var btn=f.url?'<a class="go" href="'+esc(f.url)+'" target="_blank" rel="noopener">تحميل</a>':'<button class="go" disabled>قريباً</button>';
    return '<li class="card"><p class="t">'+(f.hot?'🔥':'📄')+' '+esc(f.title)+'</p><p class="m">'+esc(f.subject)+' · '+esc(f.stage)+'</p>'+btn+'</li>';
  }).join(""):'<li class="empty">لا توجد مذكرات مطابقة.</li>';
}
$("stages").addEventListener("click",function(e){var b=e.target.closest(".stage");if(!b)return;st.stage=b.dataset.v;
  [].forEach.call(document.querySelectorAll(".stage"),function(t){t.setAttribute("aria-pressed",t===b)});render()});
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;st.subject=b.dataset.v;chips();render()});
$("q").addEventListener("input",function(e){st.q=e.target.value;render()});
var hot=FILES.filter(function(f){return f.hot})[0];
if(hot){$("tt").textContent="🔥 "+hot.title;$("td").textContent=(hot.desc||"")+" ("+hot.stage+")";$("toast").hidden=false}
$("x").addEventListener("click",function(){$("toast").hidden=true});
chips();render();
</script>
</body>
</html>
